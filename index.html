<p id="status">Scanning device…</p>
<div class="bar"><div class="fill" id="fill"></div></div>
<p id="threats">Threats detected: 0</p>
<p class="small" id="note">Checking system security…</p>
</main>
<script>
let p=0,t=0;
const fill=document.querySelector("#fill");
const status=document.querySelector("#status");
const timer=setInterval(()=>{
 p=Math.min(100,p+Math.floor(Math.random()*5)+1);
 fill.style.width=p+"%";
 status.textContent="Scanning device… "+p+"%";
 if(Math.random()>.55 && t<7)t++;
 document.querySelector("#threats").textContent="Threats detected: "+t;
 if(p>=100){
  clearInterval(timer);
  document.querySelector("#status").textContent="Scan complete";
  document.querySelector("#threats").textContent="😂 PRANK!";
  document.querySelector("#note").textContent="No viruses were detected. This page is only a harmless joke.";
 }
},250);
</script>
</body>
</html>
