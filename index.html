<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Alert</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07090d;color:white;font-family:Arial;display:flex;align-items:center;justify-content:center;padding:20px}.c{width:100%;max-width:430px;background:#11161d;border:1px solid #343b45;border-radius:20px;padding:30px;text-align:center}.i{font-size:70px}h1{font-size:36px;color:#ff453a}p{color:#b5bdc9;line-height:1.5}button{width:100%;border:0;border-radius:13px;padding:17px;margin-top:18px;background:#ff3b30;color:white;font-size:18px;font-weight:800}.hide{display:none}.bar{height:17px;background:#292f38;border-radius:20px;overflow:hidden;margin:22px 0}.fill{height:100%;width:0;background:#ff453a}.pct{font-size:32px;font-weight:bold}.flash{animation:f .4s infinite alternate}@keyframes f{to{background:#310000}}</style><body id="b"><div class="c" id="w"><div class="i">🚨</div><h1>YOU HAVE A VIRUS</h1><p>A security threat has been detected.</p><button onclick="go()">CLICK HERE TO REMOVE VIRUS</button></div><div class="c hide" id="r"><div class="i">⚠️</div><h1>REMOVING VIRUS...</h1><div class="bar"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div><div class="c hide" id="fail"><div class="i">🚨</div><h1>REMOVAL FAILED</h1><p>Unable to remove the detected threat.</p></div><div class="c hide" id="prank"><div class="i">😂</div><h1 style="color:white">PRANK!</h1><p>Your device is completely safe. There was never a virus. Nothing was downloaded and nothing on your device was changed.</p></div><script>let a,o,g,s;function show(x){document.querySelectorAll(".c").forEach(e=>e.classList.add("hide"));document.getElementById(x).classList.remove("hide")}function alarm(){a=new(window.AudioContext||window.webkitAudioContext)();g=a.createGain();g.gain.value=.07;g.connect(a.destination);o=a.createOscillator();o.type="square";o.frequency.value=620;o.connect(g);o.start();let h=0;s=setInterval(()=>{h=!h;o.frequency.exponentialRampToValueAtTime(h?1150:620,a.currentTime+.2)},250)}function stop(){clearInterval(s);try{o.stop()}catch(e){}b.classList.remove("flash")}function go(){alarm();b.classList.add("flash");show("r");let p=0,t=setInterval(()=>{p=Math.min(100,p+3);fill.style.width=p+"%";pct.textContent=p+"%";if(p==100){clearInterval(t);setTimeout(()=>{show("fail");setTimeout(()=>{stop();show("prank")},1800)},350)}},85)}</script>
