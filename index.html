<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security Scan</title>
</head>
<body style="margin:0;min-height:100vh;padding:22px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#f3f4f6;color:#171717;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
  <main style="box-sizing:border-box;width:100%;max-width:520px;padding:30px 24px;text-align:center;background:white;border-radius:20px;box-shadow:0 12px 35px rgba(0,0,0,.15);">
    <div style="font-size:64px;">⚠️</div>
    <h1 style="margin:8px 0;color:#c40000;font-size:30px;">Security Alert</h1>
    <p id="status" style="font-size:18px;">Scanning device… 0%</p>

    <div style="height:16px;margin:25px 0;overflow:hidden;background:#e5e5e5;border-radius:999px;">
      <div id="fill" style="width:0%;height:100%;background:#c40000;border-radius:999px;transition:width .22s ease;"></div>
    </div>

    <p id="threats" style="font-size:23px;font-weight:700;">Threats detected: 0</p>
    <p id="note" style="margin-top:18px;color:#666;font-size:14px;">Checking system security…</p>
  </main>

<script>
let progress=0, threats=0;
const fill=document.getElementById("fill");
const status=document.getElementById("status");
const threatText=document.getElementById("threats");
const note=document.getElementById("note");

const timer=setInterval(function(){
  progress=Math.min(100,progress+Math.floor(Math.random()*5)+2);
  fill.style.width=progress+"%";
  status.textContent="Scanning device… "+progress+"%";

  if(Math.random()>0.55 && threats<7) threats++;
  threatText.textContent="Threats detected: "+threats;

  if(progress>=100){
    clearInterval(timer);
    status.textContent="Scan complete";
    threatText.textContent="⚠️ YOU HAVE A VIRUS!";
    note.textContent="Security threat detected.";

    setTimeout(function(){
      threatText.textContent="😂 PRANK!";
      note.textContent="No viruses were detected. This page is only a harmless joke.";
    },2000);
  }
},250);
</script>
</body>
</html>
